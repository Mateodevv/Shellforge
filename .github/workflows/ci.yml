# CI -- runs on every push so that "it builds" is a fact, not a claim.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux and Windows both, and not for symmetry with SHELLHOUND: this
        # repository normalises absolute paths back to webroot-relative ones,
        # case-insensitively on one platform and not the other. Path handling
        # is exactly the class of bug that only the other operating system
        # reveals, and here it sits in the scorer -- the part that decides
        # whether a run passes.
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # No dependencies to install. If that ever stops being true, this line
      # is where it will be noticed.
      - name: Imports
        run: python -c "import shellforge.cli, shellforge.generate, shellforge.score; print('import ok')"
      - name: Tests
        run: python -m unittest discover -s tests -t . -v
      # Generation must work without SHELLHOUND present -- a case is evidence
      # plus ground truth, and neither needs a detector to exist.
      - name: Generate standalone
        run: python -m shellforge gen --seed 42 --out ./ci-cases --json

  determinism:
    name: A seed determines the bytes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # The claim the whole tool rests on, checked as a claim rather than as
      # a unit test: two independent processes, not two calls in one.
      - name: Same seed twice, byte for byte
        run: |
          python -m shellforge gen --seed 4711 --scale medium --out ./a --json > a.json
          python -m shellforge gen --seed 4711 --scale medium --out ./b --json > b.json
          diff <(python -c "import json;print(json.load(open('a.json'))['digest'])") \
               <(python -c "import json;print(json.load(open('b.json'))['digest'])")
          diff -r ./a ./b

  against-shellhound:
    name: Score against SHELLHOUND
    runs-on: ubuntu-latest
    # THE JOB THIS REPOSITORY EXISTS FOR. Everything above tests the
    # generator; this one tests the thing the generator was built to test.
    # It checks out SHELLHOUND's main branch, so it turns red for two
    # different reasons -- a regression here, or a detection regression
    # there -- and the score report says which.
    steps:
      - uses: actions/checkout@v7
        with:
          path: shellforge
      - uses: actions/checkout@v7
        with:
          repository: Mateodevv/shellhound
          path: shellhound
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: SHELLHOUND dependencies
        run: pip install -r shellhound/requirements.txt
      - name: Score every scenario
        working-directory: shellforge
        # `--all` also reports coverage summed over the catalogue, which is
        # the only level at which coverage means anything: per case it says
        # what one narrative happened to touch.
        run: python -m shellforge check --all --shellhound ../shellhound
      - name: Score across seeds
        working-directory: shellforge
        # One seed passing is one arrangement of the noise passing. The
        # baseline is randomised, so a rule that only survives a particular
        # spread of ordinary traffic fails here and not above.
        run: |
          for seed in 2 3 42 4711; do
            python -m shellforge check --all --seed "$seed" --shellhound ../shellhound
          done
      - name: Score along every hostile axis
        working-directory: shellforge
        # Each axis on its own over the whole catalogue: 19 pairings x 5
        # shapes. An axis reshapes the evidence and leaves the ground truth
        # alone, so this re-runs every existing assertion over a harder file
        # -- a byte-order mark, a Latin-1 log, malformed lines between good
        # ones, 677 clients, a database clock two hours out.
        run: python -m shellforge check --all --hostile all --shellhound ../shellhound
      - name: Decisions across a re-scan
        working-directory: shellforge
        # The one check that is not about findings: v1, a human decision, v2
        # into the same case, and then whether the decision still means
        # anything. Scenarios with no file artifacts skip themselves.
        run: |
          for s in wp-upload-shell shell-kit false-guard ghost-shell; do
            python -m shellforge evolve --scenario "$s" --shellhound ../shellhound
          done
          python -m shellforge evolve --scenario joomla-helix3 --cms joomla --shellhound ../shellhound
      - name: Score at scale
        working-directory: shellforge
        # A quarter of a million log lines, rotated and gzipped. This is
        # where "55,000 lines per second" stops being a claim.
        run: python -m shellforge check --seed 8 --scale large --rotate-days 7 --shellhound ../shellhound
